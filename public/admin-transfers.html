<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>مراجعة التحويلات | SUMSN</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#151b23;--line:#293446;--text:#f5f7fb;--muted:#aab4c5;--blue:#2563eb;--green:#179c68;--red:#dc3e49;--amber:#c77b19}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}.shell{width:min(1100px,calc(100% - 26px));margin:28px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{font-size:25px;font-weight:900}.top a{color:#dce7f7;text-decoration:none;border:1px solid var(--line);padding:8px 13px;border-radius:10px}.intro,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:15px}.intro h1{margin:0 0 6px}.muted{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.refresh,.approve,.reject,.receipt{border:0;border-radius:10px;padding:10px 13px;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex}.refresh{background:#2a3c57}.approve{background:var(--green)}.reject{background:var(--red)}.receipt{background:#33445f}.list{display:grid;gap:14px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.status{display:inline-flex;border-radius:999px;padding:5px 10px;background:#263650;color:#e2ecff;font-size:13px;font-weight:800}.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}.detail{padding:11px;background:#10161e;border-radius:11px}.detail span{display:block;color:var(--muted);font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px}.message{padding:12px;border-radius:11px;margin-top:12px;background:#3b2811;color:#ffdca5}.empty{text-align:center;color:var(--muted);padding:35px}.danger{border-color:#6a3037}.success{border-color:#235e49}@media(max-width:760px){.details{grid-template-columns:1fr 1fr}.head{display:block}.status{margin-top:8px}}@media(max-width:450px){.details{grid-template-columns:1fr}.intro,.card{padding:16px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand">SUMSN — الإدارة</div><a href="/index.html">العودة للموقع</a></div>
    <section class="intro"><h1>مراجعة التحويلات البنكية</h1><p class="muted">لا تعتمد أي طلب اعتمادًا على صورة الإيصال وحدها. افتح تطبيق البنك وتأكد من دخول المبلغ الصحيح ورقم الطلب، ثم اضغط اعتماد وإصدار البوليصة.</p><div class="toolbar"><span id="account">جارٍ التحقق من صلاحية الحساب...</span><button class="refresh" id="refresh" type="button">تحديث الطلبات</button></div></section>
    <div id="message" class="message" hidden></div>
    <section class="list" id="list"><div class="empty">جارٍ تحميل الطلبات...</div></section>
  </main>
  <script>
    (()=>{
      const $=selector=>document.querySelector(selector);
      const labels={awaiting_transfer:'لم يرفع إيصالًا',pending_review:'بانتظار المراجعة',rejected:'مرفوض',processing:'جارٍ الإصدار',issuance_failed:'فشل الإصدار — قابل لإعادة المحاولة',paid_hold:'معتمد والإصدار متوقف',shipment_created:'تم إصدار البوليصة'};
      const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const date=value=>value?new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)):'—';
      async function request(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(body.message||'تعذر إتمام الطلب');error.body=body;throw error}return body}
      function showMessage(value){$('#message').textContent=value;$('#message').hidden=!value}
      function card(item){const canApprove=['pending_review','issuance_failed','paid_hold'].includes(item.status);const approveLabel=item.status==='pending_review'?'اعتماد التحويل وإصدار البوليصة':'إعادة محاولة إصدار البوليصة';return `<article class="card ${item.status==='shipment_created'?'success':item.status==='issuance_failed'?'danger':''}" data-order="${esc(item.orderNumber)}"><div class="head"><div><strong>${esc(item.orderNumber)}</strong><div class="muted">${esc(item.customerEmail||'')}</div></div><span class="status">${esc(labels[item.status]||item.status)}</span></div><div class="details"><div class="detail"><span>المبلغ</span><b>${Number(item.amount||0).toFixed(2)} ر.س</b></div><div class="detail"><span>شركة الشحن</span><b>${esc(item.carrier||'—')}</b></div><div class="detail"><span>تاريخ الطلب</span><b>${esc(date(item.createdAt))}</b></div><div class="detail"><span>محاولات الإصدار</span><b>${Number(item.issuanceAttempts||0)}</b></div></div>${item.reviewNote?`<div class="message">${esc(item.reviewNote)}</div>`:''}<div class="actions">${item.receiptUrl?`<a class="receipt" href="${esc(item.receiptUrl)}" target="_blank" rel="noopener">فتح الإيصال</a>`:''}${canApprove?`<button class="approve" type="button">${approveLabel}</button>`:''}${item.status==='pending_review'?'<button class="reject" type="button">رفض الإيصال</button>':''}${item.shipment?.labelUrl?`<a class="receipt" href="${esc(item.shipment.labelUrl)}" target="_blank" rel="noopener">فتح البوليصة</a>`:''}</div></article>`}
      async function load(){showMessage('');$('#list').innerHTML='<div class="empty">جارٍ تحميل الطلبات...</div>';try{const session=await request('/api/auth/me',{cache:'no-store'});if(!session.user){location.assign('/index.html?account=login');return}if(!session.user.isBankTransferAdmin)throw new Error('هذا الحساب غير مخول بمراجعة التحويلات. سجّل الدخول ببريد الإدارة المحدد.');$('#account').textContent=`حساب الإدارة: ${session.user.email}`;const body=await request('/api/admin/bank-transfers',{cache:'no-store'});$('#list').innerHTML=body.items?.length?body.items.map(card).join(''):'<div class="empty">لا توجد طلبات تحويل حتى الآن.</div>'}catch(error){$('#list').innerHTML='<div class="empty">تعذر تحميل الطلبات.</div>';showMessage(error.message)}}
      $('#refresh').addEventListener('click',load);
      $('#list').addEventListener('click',async event=>{const article=event.target.closest('[data-order]');if(!article)return;const order=article.dataset.order;if(event.target.classList.contains('approve')){if(!confirm(`هل فتحت تطبيق البنك وتأكدت بنفسك من وصول المبلغ الصحيح للطلب ${order}؟\n\nعند الموافقة سيحاول النظام إصدار بوليصة حقيقية وخصم رصيد OTO.`))return;event.target.disabled=true;try{const body=await request('/api/admin/bank-transfers/'+encodeURIComponent(order)+'/approve',{method:'POST',body:JSON.stringify({bankDepositConfirmed:true})});alert(body.status==='shipment_created'?'تم اعتماد التحويل وإصدار البوليصة بنجاح.':'تم تحديث الطلب، ولم تصدر البوليصة بعد.');await load()}catch(error){alert(error.message);await load()}finally{event.target.disabled=false}}if(event.target.classList.contains('reject')){const note=prompt('اكتب سبب رفض الإيصال ليظهر للعميل:','تعذر مطابقة التحويل مع الحساب البنكي.');if(note===null)return;event.target.disabled=true;try{await request('/api/admin/bank-transfers/'+encodeURIComponent(order)+'/reject',{method:'POST',body:JSON.stringify({note})});await load()}catch(error){alert(error.message)}finally{event.target.disabled=false}}});
      load();
    })();
  </script>
</body>
</html>
