<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1769ff">
    <title>SUMSN — لا يوجد اتصال</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display:grid; min-height:100vh; min-height:100dvh; margin:0; place-items:center; background:linear-gradient(180deg,#f7faff,#fff); color:#102042; }
      main { width:min(34rem,calc(100% - 2rem)); padding:2.2rem; border:1px solid #dfe6ef; border-radius:1.5rem; background:#fff; box-shadow:0 1.5rem 4rem rgba(16,32,66,.09); text-align:center; }
      img { width:6rem; height:6rem; }
      h1 { margin:.8rem 0 .35rem; }
      p { color:#667085; line-height:1.8; }
      button { width:100%; min-height:3.25rem; margin-top:1rem; border:0; border-radius:1rem; background:#1769ff; color:#fff; font:inherit; font-weight:800; }
    </style>
  </head>
  <body>
    <main>
      <img src="app-icon.svg" alt="">
      <h1>تعذر الاتصال بـ SUMSN</h1>
      <p>تحتاج مقارنة الأسعار وإصدار البوليصة إلى اتصال آمن بالإنترنت. تحقق من الشبكة ثم أعد المحاولة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
