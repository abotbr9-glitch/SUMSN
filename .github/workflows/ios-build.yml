name: Verify SUMSN iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run server and security tests
        run: npm run check

      - name: Synchronize Capacitor iOS project
        run: npm run native:sync

      - name: Compile iOS app without signing
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
